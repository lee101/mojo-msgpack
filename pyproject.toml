[project]
name = "mojo-msgpack"
version = "0.1.0"
description = "MessagePack pack/unpack wire kernels implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "msgpack", "serialization", "messagepack"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "msgpack"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-msgpack"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
